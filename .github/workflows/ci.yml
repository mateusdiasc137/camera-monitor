name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - run: uv sync --locked
      - name: MediaMTX para os testes de integração (hash conferido)
        working-directory: .
        run: python scripts/fetch_tools.py
      - name: FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (formatação)
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: contratos de arquitetura (import-linter)
        run: uv run lint-imports
      - name: testes
        run: uv run pytest -q

  web:
    name: web (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api-contract:
    name: cliente da API atualizado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --locked
        working-directory: apps/backend
      - run: npm ci
        working-directory: apps/web
      - run: npm run gen:api
        working-directory: apps/web
      - name: tipos gerados devem estar commitados
        run: git diff --exit-code -- apps/web/src/api

  scripts:
    name: scripts da Fase 0 (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run --no-project --python 3.12 python -m compileall -q scripts infra

  install-linux:
    # Instalação real numa VM Ubuntu com systemd: serviços, usuários, sandbox, firewall, HTTPS, gravação
    # de uma câmera falsa, permissões entre os serviços, reinício, atualização e remoção.
    name: instalação no Ubuntu Server (systemd)
    runs-on: ubuntu-24.04
    env:
      NVR_VERIFY_PASSWORD: senha-de-teste-123
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: interface compilada
        working-directory: apps/web
        run: npm ci && npm run build
      - name: instalar (com firewall da LAN)
        run: sudo infra/linux/install.sh --storage-root /srv/nvr --site-address nvr-camera-monitor.home.arpa --firewall auto --yes
      - name: primeiro usuário (como no servidor de verdade)
        run: printf '%s\n%s\n' "$NVR_VERIFY_PASSWORD" "$NVR_VERIFY_PASSWORD" | sudo nvr-admin create-user admin
      - name: câmera falsa (RTSP local na porta 8654)
        run: |
          nohup python3 scripts/fake_camera.py > /tmp/fake-camera.log 2>&1 &
          for i in $(seq 30); do (exec 3<>/dev/tcp/127.0.0.1/8654) 2>/dev/null && break; sleep 1; done
      - name: verificar a instalação, a gravação e o reinício
        run: sudo --preserve-env=NVR_VERIFY_PASSWORD /opt/nvr/app/.venv/bin/python infra/linux/verify_install.py --user admin --password-env NVR_VERIFY_PASSWORD --camera 127.0.0.1:8654
      - name: atualizar (instalar de novo) mantém dados e configuração
        run: |
          sudo infra/linux/install.sh --yes
          sudo --preserve-env=NVR_VERIFY_PASSWORD /opt/nvr/app/.venv/bin/python infra/linux/verify_install.py --user admin --password-env NVR_VERIFY_PASSWORD
      - name: firewall
        run: sudo ufw status verbose
      - name: logs dos serviços (em caso de falha)
        if: failure()
        run: |
          sudo journalctl -u nvr-mediamtx -u nvr-api -u nvr-caddy --no-pager -n 300
          cat /tmp/fake-camera.log || true
      - name: remover
        run: |
          sudo infra/linux/uninstall.sh
          if systemctl list-unit-files | grep -q '^nvr-'; then echo "units do NVR ainda instaladas"; exit 1; fi
          test -d /srv/nvr/recordings  # gravações nunca são apagadas

  secrets:
    name: varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
