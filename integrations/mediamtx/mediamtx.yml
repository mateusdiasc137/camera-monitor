# Configuração do MediaMTX para o NVR (Fase 1). SEM câmeras e SEM segredos:
# as câmeras são criadas pelo backend via API de controle (em memória) e cada stream chega
# por um relay FFmpeg local (ADR-002). A autorização é feita pelo backend (ADR-003).
#
# Rodar em desenvolvimento:  python scripts/dev_mediamtx.py
# Produção (Ubuntu): serviço systemd nvr-mediamtx apontando para este arquivo (F1-19).

logLevel: info

# --- Autenticação: o backend decide (publish só do relay local; leitura só pelo próprio backend,
# que intermedia o WebRTC do navegador com a sessão do painel — ADR-003)
authMethod: http
authHTTPAddress: http://127.0.0.1:8000/internal/mediamtx/auth
authHTTPExclude:
  # A API de controle só escuta no loopback; o backend a usa sem credencial.
  - action: api
  - action: metrics

# --- API de controle: somente loopback
api: true
apiAddress: 127.0.0.1:9997

# --- RTSP: só loopback (relays publicam aqui; nada exposto na LAN)
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: false
srt: false
moq: false

# --- WebRTC: a sinalização (HTTP) só no loopback — o navegador negocia pelo backend (/api/v1/cameras/{id}/whep).
# A mídia (UDP 8189) precisa ser alcançável pela LAN: o MediaMTX anuncia os IPs das interfaces.
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcLocalUDPAddress: :8189
webrtcAllowOrigins: []
hls: true
hlsAddress: 127.0.0.1:8888
hlsAllowOrigins: []
playback: true
playbackAddress: 127.0.0.1:9996
playbackAllowOrigins: []

metrics: false
pprof: false

pathDefaults:
  source: publisher
  overridePublisher: true
  record: false
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 5m
  # Retenção desligada: a política de cota/substituição é do backend (ADR-006).
  recordDeleteAfter: 0s

# Nenhum path estático: só os criados pelo backend ("cam-<id>-main|sub") existem.
paths: {}
